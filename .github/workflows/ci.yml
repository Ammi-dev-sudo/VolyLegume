name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  pint:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        run: php artisan test --compact --log-junit junit.xml

      - name: Verify README test counters
        run: |
          php -r '
          $xml = simplexml_load_file("junit.xml");
          $suite = $xml->testsuite[0];
          $tests = (int) $suite["tests"];
          $assertions = (int) $suite["assertions"];
          $expected = "($tests tests, $assertions assertions)";
          $readme = file_get_contents("README.md");

          if (! str_contains($readme, $expected)) {
              fwrite(STDERR, "README.md ne correspond pas à la suite : {$expected}\n");
              exit(1);
          }

          echo "README.md à jour : {$expected}\n";
          '

  tests-postgresql:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: volylegume_test
          POSTGRES_USER: volylegume
          POSTGRES_PASSWORD: volylegume_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volylegume -d volylegume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: volylegume_test
      DB_USERNAME: volylegume
      DB_PASSWORD: volylegume_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ensure PostgreSQL 18 client
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || [ "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -lt 18 ]; then
            sudo apt-get remove -y libpq-dev || true
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
            sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client-18
          fi
          pg_dump --version
          pg_restore --version

      - name: Run test suite
        run: php artisan test --compact --log-junit junit.xml

      - name: Verify README test counters
        run: |
          php -r '
          $xml = simplexml_load_file("junit.xml");
          $suite = $xml->testsuite[0];
          $tests = (int) $suite["tests"];
          $assertions = (int) $suite["assertions"];
          $expected = "($tests tests, $assertions assertions)";
          $readme = file_get_contents("README.md");

          if (! str_contains($readme, $expected)) {
              fwrite(STDERR, "README.md ne correspond pas à la suite : {$expected}\n");
              exit(1);
          }

          echo "README.md à jour : {$expected}\n";
          '

  frontend:
    name: Front-end build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
