# Réglage PostgreSQL pour VolyLegume — usage "gros volumes de données".
#
# Ce fichier est monté dans le conteneur et utilisé via
# `postgres -c config_file=/etc/postgresql/postgresql.conf`.
#
# Hôte de référence : 8 vCPU / 7 Go de RAM / SSD.
# Adapte `shared_buffers`, `work_mem` et `effective_cache_size` selon la RAM
# réellement disponible (cf. README § Base de données).

# --- Réseau -----------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 60

# La configuration est montée hors de PGDATA : on pointe explicitement les
# fichiers générés par initdb, sinon le serveur ne trouve ni pg_hba.conf
# ni pg_ident.conf et refuse toute connexion.
hba_file = '/var/lib/postgresql/18/docker/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# --- Mémoire ----------------------------------------------------------------
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 8MB
maintenance_work_mem = 512MB
temp_buffers = 8MB

# --- Journalisation (WAL) ---------------------------------------------------
# WAL large + checkpoints espacés : les imports massifs n'écrivent pas en
# boucle le checkpoint, le WAL est recyclé plus tard.
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_buffers = 16MB

# --- Disque (SSD) ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallélisme ------------------------------------------------------------
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 2

# --- Maintenance automatique ------------------------------------------------
# Sur de gros volumes, l'autovacuum doit passer plus souvent et avec des
# seuils plus bas, sinon les index se dégradent et les plans deviennent faux.
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05

# --- Observabilité -----------------------------------------------------------
track_io_timing = on
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB

# --- Divers -----------------------------------------------------------------
jit = off
# L'image alpine ne fournit pas tzdata : on utilise la notation POSIX
# (EAT-3 = UTC+3, Madagascar n'a pas de changement d'heure).
timezone = 'EAT-3'
datestyle = 'iso, mdy'
lc_messages = 'C'
