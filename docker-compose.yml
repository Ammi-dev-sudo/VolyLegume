services:
  postgres:
    image: postgres:17-alpine
    container_name: volylegume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volylegume
      POSTGRES_USER: volylegume
      POSTGRES_PASSWORD: volylegume_secret
    ports:
      - "5433:5432"
    volumes:
      - volylegume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volylegume -d volylegume"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  volylegume_pgdata:
