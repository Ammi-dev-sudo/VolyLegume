services:
  postgres:
    image: postgres:18-alpine
    container_name: volylegume-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volylegume
      POSTGRES_USER: volylegume
      POSTGRES_PASSWORD: volylegume_secret
    # La configuration montée ci-dessous remplace celle de l'image : c'est
    # elle qui porte le réglage "gros volumes" (voir docker/postgres/postgresql.conf).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5433:5432"
    volumes:
      # PostgreSQL 18 exige un montage unique sur /var/lib/postgresql : les
      # données sont rangées dans un sous-répertoire versionné (PGDATA).
      - volylegume_pgdata:/var/lib/postgresql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # Espace partagé accru : les requêtes parallèles et les tris volumineux
    # s'appuient dessus au lieu d'écrire dans le disque du conteneur.
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volylegume -d volylegume"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  volylegume_pgdata:
